{% extends "base.html" %}

{% block content %}
<div class="glass-container" style="max-width: 900px; margin: 3rem auto; padding: 2rem; border-radius: 24px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
        <div>
            <h1
                style="margin: 0; background: var(--gradient); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; font-size: 2.2rem;">
                Edit Milestone</h1>
            <p style="color: var(--text-muted); margin: 0.5rem 0 0 0;">Refining the story: {{ achievement.title }}</p>
        </div>
        <a href="{{ url_for('faculty.manage_achievements') }}" class="btn btn-outline"
            style="border-radius: 12px; padding: 0.6rem 1.2rem;">
            <i class="fas fa-arrow-left"></i> Back to Achievements
        </a>
    </div>

    <form action="{{ url_for('faculty.edit_achievement', id=achievement.id) }}" method="POST"
        enctype="multipart/form-data" class="premium-form"
        style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; background: rgba(255,255,255,0.02); padding: 2.5rem; border-radius: 24px; border: 1px solid var(--border);">

        <div class="form-group" style="grid-column: span 2;">
            <label
                style="color: var(--text-muted); font-weight: 500; font-size: 0.9rem; margin-bottom: 0.5rem; display: block;">Achievement
                Title</label>
            <input type="text" name="title" class="form-control" value="{{ achievement.title }}" required
                style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 1rem;">
        </div>

        <div class="form-group" style="grid-column: span 2;">
            <label
                style="color: var(--text-muted); font-weight: 500; font-size: 0.9rem; margin-bottom: 0.5rem; display: block;">Complete
                Description</label>
            <textarea name="description" class="form-control" rows="5" required
                style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 1rem;">{{ achievement.description }}</textarea>
        </div>

        <div class="form-group">
            <label
                style="color: var(--text-muted); font-weight: 500; font-size: 0.9rem; margin-bottom: 0.5rem; display: block;">Update
                Image URL</label>
            <input type="url" name="image_url" class="form-control" value="{{ achievement.image_url }}"
                placeholder="https://images.unsplash.com/..."
                style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 1rem;">
        </div>

        <div class="form-group">
            <label
                style="color: var(--text-muted); font-weight: 500; font-size: 0.9rem; margin-bottom: 0.5rem; display: block;">
                Replace Media/File
            </label>
            <input type="file" name="file" class="form-control"
                style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 0.8rem;">
            <small style="color: var(--text-muted); display: block; margin-top: 0.5rem;">Upload a new photo or PDF
                certificate to replace the current one.</small>
        </div>

        {% if achievement.image_url %}
        <div class="form-group" style="grid-column: span 2;">
            <label
                style="color: var(--text-muted); font-weight: 500; font-size: 0.9rem; margin-bottom: 1rem; display: block;">Current
                Preview</label>
            <div
                style="width: 100%; height: 200px; border-radius: 16px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1);">
                <img src="{{ achievement.image_url }}" style="width: 100%; height: 100%; object-fit: cover;">
            </div>
        </div>
        {% endif %}

        <div style="grid-column: span 2; display: flex; gap: 1rem; margin-top: 2rem;">
            <button type="submit" class="btn btn-primary"
                style="flex: 2; padding: 1.2rem; border-radius: 16px; font-weight: 600; font-size: 1.1rem; background: var(--gradient); border: none; letter-spacing: 1px; box-shadow: 0 8px 24px rgba(var(--primary-rgb), 0.3);">
                <i class="fas fa-check-circle"></i> UPDATE MILESTONE
            </button>
            <a href="{{ url_for('faculty.manage_achievements') }}" class="btn btn-outline"
                style="flex: 1; padding: 1.2rem; border-radius: 16px; display: flex; align-items: center; justify-content: center; border-color: rgba(255,255,255,0.1);">
                CANCEL
            </a>
        </div>
    </form>
</div>
{% endblock %}

{% extends "base.html" %}

{% block body_class %}auth-page{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 4rem auto; border-radius: 24px;">
    <h2
        style="text-align: center; margin-bottom: 0.5rem; background: var(--gradient); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;">
        Set New Password</h2>
    <p style="text-align: center; color: var(--text-muted); margin-bottom: 2rem;">Choose a secure password for your
        account.</p>

    <form method="POST">
        <div class="form-group">
            <label for="password">New Password</label>
            <div style="position: relative;">
                <input type="password" name="password" id="password" class="form-control" required>
                <i class="fas fa-eye" id="togglePassword"
                    style="position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--primary-color);"></i>
            </div>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Update Password</button>
    </form>
</div>

<script>
    const togglePassword = document.querySelector('#togglePassword');
    const password = document.querySelector('#password');

    togglePassword.addEventListener('click', function (e) {
        // toggle the type attribute
        const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
        password.setAttribute('type', type);
        // toggle the eye / eye slash icon
        this.classList.toggle('fa-eye-slash');
    });
</script>
{% endblock %}

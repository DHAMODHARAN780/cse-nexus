{% extends "base.html" %}

{% block body_class %}auth-page{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 4rem auto; border-radius: 24px;">
    <h2
        style="text-align: center; margin-bottom: 0.5rem; background: var(--gradient); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;">
        Verify OTP</h2>
    <p style="text-align: center; color: var(--text-muted); margin-bottom: 2rem;">A 6-digit code has been sent to
        <strong>{{ email }}</strong>.</p>

    <form method="POST">
        <div class="form-group">
            <label for="otp">Enter 6-digit OTP</label>
            <input type="text" name="otp" id="otp" class="form-control" placeholder="000000" maxlength="6"
                pattern="\d{6}" style="text-align: center; font-size: 1.5rem; letter-spacing: 0.5rem;" required
                autofocus>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Verify OTP</button>

        <p style="text-align: center; margin-top: 1.5rem;">
            <a href="{{ url_for('auth.forgot_password') }}" style="color: var(--text-muted); font-size: 0.9rem;">Resend
                Code</a>
        </p>
    </form>
</div>
{% endblock %}

{% extends "base.html" %}

{% block content %}
<div class="glass-container" style="max-width: 800px; margin: 3rem auto; padding: 2rem; border-radius: 24px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
        <div>
            <h1
                style="margin: 0; background: var(--gradient); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; font-size: 2.2rem;">
                Edit Timetable</h1>
            <p style="color: var(--text-muted); margin: 0.5rem 0 0 0;">Update details for: {{ timetable.title }}</p>
        </div>
        <a href="{{ url_for('faculty.manage_timetable') }}" class="btn btn-outline"
            style="border-radius: 12px; padding: 0.6rem 1.2rem;">
            <i class="fas fa-arrow-left"></i> Back to List
        </a>
    </div>

    <form action="{{ url_for('faculty.edit_timetable', id=timetable.id) }}" method="POST" enctype="multipart/form-data"
        class="premium-form"
        style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; background: rgba(255,255,255,0.02); padding: 2rem; border-radius: 20px; border: 1px solid var(--border);">

        <div class="form-group" style="grid-column: span 2;">
            <label
                style="color: var(--text-muted); font-weight: 500; font-size: 0.9rem; margin-bottom: 0.5rem; display: block;">Timetable
                Title</label>
            <input type="text" name="title" class="form-control" value="{{ timetable.title }}" required
                style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 1rem;">
        </div>

        <div class="form-group">
            <label
                style="color: var(--text-muted); font-weight: 500; font-size: 0.9rem; margin-bottom: 0.5rem; display: block;">Year</label>
            <select name="year" class="form-control"
                style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 1rem;">
                <option value="1" {% if timetable.year==1 %}selected{% endif %}>1st Year</option>
                <option value="2" {% if timetable.year==2 %}selected{% endif %}>2nd Year</option>
                <option value="3" {% if timetable.year==3 %}selected{% endif %}>3rd Year</option>
                <option value="4" {% if timetable.year==4 %}selected{% endif %}>4th Year</option>
            </select>
        </div>

        <div class="form-group">
            <label
                style="color: var(--text-muted); font-weight: 500; font-size: 0.9rem; margin-bottom: 0.5rem; display: block;">Semester</label>
            <input type="number" name="semester" class="form-control" min="1" max="8" value="{{ timetable.semester }}"
                required
                style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 1rem;">
        </div>

        <div class="form-group" style="grid-column: span 2;">
            <label
                style="color: var(--text-muted); font-weight: 500; font-size: 0.9rem; margin-bottom: 0.5rem; display: block;">
                Replace Timetable File (Optional)
            </label>
            <div
                style="background: rgba(0, 210, 255, 0.05); padding: 1rem; border-radius: 12px; margin-bottom: 1rem; border: 1px dashed rgba(0, 210, 255, 0.2);">
                <p style="margin: 0; font-size: 0.85rem; color: var(--primary-color);">
                    <i class="fas fa-file-alt"></i> Current File: {{ timetable.file_path.split('/')[-1] }}
                </p>
            </div>
            <input type="file" name="file" class="form-control"
                style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 0.8rem;">
            <small style="color: var(--text-muted); display: block; margin-top: 0.5rem;">Leave blank to keep the current
                file.</small>
        </div>

        <div style="grid-column: span 2; display: flex; gap: 1rem; margin-top: 1rem;">
            <button type="submit" class="btn btn-primary"
                style="flex: 2; padding: 1.2rem; border-radius: 16px; font-weight: 600; font-size: 1.1rem; background: var(--gradient); border: none; letter-spacing: 1px; box-shadow: 0 8px 24px rgba(var(--primary-rgb), 0.3);">
                <i class="fas fa-save"></i> SAVE CHANGES
            </button>
            <a href="{{ url_for('faculty.manage_timetable') }}" class="btn btn-outline"
                style="flex: 1; padding: 1.2rem; border-radius: 16px; display: flex; align-items: center; justify-content: center; border-color: rgba(255,255,255,0.1);">
                CANCEL
            </a>
        </div>
    </form>
</div>
{% endblock %}

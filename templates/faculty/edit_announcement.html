{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width: 700px; margin: 3rem auto; border-radius: 24px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
        <div>
            <h1
                style="margin: 0; background: var(--gradient); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;">
                Edit Announcement</h1>
            <p style="color: var(--text-muted); margin-top: 0.5rem;">Update post details</p>
        </div>
        <a href="{{ url_for('faculty.announcements') }}" class="btn btn-outline"
            style="border-radius: 12px; padding: 0.5rem 1rem;">
            <i class="fas fa-times"></i> Cancel
        </a>
    </div>

    <form action="{{ url_for('faculty.edit_announcement', id=announce.id) }}" method="POST">
        <div class="form-group">
            <label for="title" style="font-weight: 500; font-size: 0.9rem; margin-bottom: 0.5rem; display: block;">Main
                Subject</label>
            <input type="text" name="title" id="title" class="form-control" required value="{{ announce.title or '' }}"
                style="background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 1rem;">
        </div>

        <div class="form-group">
            <label for="text"
                style="font-weight: 500; font-size: 0.9rem; margin-bottom: 0.5rem; display: block;">Detailed
                Content</label>
            <textarea name="text" id="text" class="form-control" rows="5" required
                style="background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.05); border-radius: 16px; padding: 1rem;">{{ announce.text }}</textarea>
        </div>

        <div class="form-group">
            <label for="type"
                style="font-weight: 500; font-size: 0.9rem; margin-bottom: 0.5rem; display: block;">Category</label>
            <select name="type" id="type" class="form-control"
                style="background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 1rem;">
                <option value="notice" {% if announce.type=='notice' %}selected{% endif %}>📢 General Notice</option>
                <option value="exam" {% if announce.type=='exam' %}selected{% endif %}>📝 Exam Update</option>
                <option value="event" {% if announce.type=='event' %}selected{% endif %}>🏆 Upcoming Event</option>
                <option value="upload" {% if announce.type=='upload' %}selected{% endif %}>📚 New Upload</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary"
            style="width: 100%; padding: 1.1rem; margin-top: 1rem; border-radius: 16px; font-weight: 600;">
            <i class="fas fa-save"></i> UPDATE ANNOUNCEMENT
        </button>
    </form>
</div>
{% endblock %}

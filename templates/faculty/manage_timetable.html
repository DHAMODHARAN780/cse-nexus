{% extends "base.html" %}

{% block content %}
<div class="glass-container" style="max-width: 900px; margin: 3rem auto; padding: 2rem; border-radius: 24px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
        <div>
            <h1
                style="margin: 0; background: var(--gradient); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; font-size: 2.2rem;">
                Manage Timetables</h1>
            <p style="color: var(--text-muted); margin: 0.5rem 0 0 0;">Upload academic schedules for students</p>
        </div>
        <a href="{{ url_for('faculty.dashboard') }}" class="btn btn-outline"
            style="border-radius: 12px; padding: 0.6rem 1.2rem;">
            <i class="fas fa-arrow-left"></i> Back
        </a>
    </div>

    <form action="{{ url_for('faculty.manage_timetable') }}" method="POST" enctype="multipart/form-data"
        class="premium-form"
        style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; background: rgba(255,255,255,0.02); padding: 2rem; border-radius: 20px; border: 1px solid var(--border);">
        <div class="form-group" style="grid-column: span 2;">
            <label
                style="color: var(--text-muted); font-weight: 500; font-size: 0.9rem; margin-bottom: 0.5rem; display: block;">Timetable
                Title</label>
            <input type="text" name="title" class="form-control" required
                placeholder="e.g. Semester 4 - Section A Timetable"
                style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 1rem;">
        </div>

        <div class="form-group">
            <label
                style="color: var(--text-muted); font-weight: 500; font-size: 0.9rem; margin-bottom: 0.5rem; display: block;">Year</label>
            <select name="year" class="form-control"
                style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 1rem;">
                <option value="1">1st Year</option>
                <option value="2">2nd Year</option>
                <option value="3">3rd Year</option>
                <option value="4">4th Year</option>
            </select>
        </div>

        <div class="form-group">
            <label
                style="color: var(--text-muted); font-weight: 500; font-size: 0.9rem; margin-bottom: 0.5rem; display: block;">Semester</label>
            <input type="number" name="semester" class="form-control" min="1" max="8" required placeholder="1-8"
                style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 1rem;">
        </div>

        <div class="form-group" style="grid-column: span 2;">
            <label
                style="color: var(--text-muted); font-weight: 500; font-size: 0.9rem; margin-bottom: 0.5rem; display: block;">Select
                Timetable File (PDF/Image)</label>
            <input type="file" name="file" class="form-control" required
                style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 0.8rem;">
        </div>

        <div style="grid-column: span 2; display: flex; gap: 1rem; margin-top: 1rem;">
            <button type="submit" class="btn btn-primary"
                style="flex: 2; padding: 1.2rem; border-radius: 16px; font-weight: 600; font-size: 1.1rem; background: var(--gradient); border: none; letter-spacing: 1px; box-shadow: 0 8px 24px rgba(var(--primary-rgb), 0.3);">
                <i class="fas fa-upload"></i> UPLOAD TIMETABLE
            </button>
            <a href="{{ url_for('faculty.dashboard') }}" class="btn btn-outline"
                style="flex: 1; padding: 1.2rem; border-radius: 16px; display: flex; align-items: center; justify-content: center; border-color: rgba(255,255,255,0.1);">
                CANCEL
            </a>
        </div>
    </form>

    {% if timetables %}
    <div style="margin-top: 3rem;">
        <h3 style="color: var(--primary-color); margin-bottom: 1.5rem;">Existing Timetables</h3>
        <div style="display: grid; gap: 1rem;">
            {% for t in timetables %}
            <div
                style="background: rgba(255,255,255,0.03); border: 1px solid var(--border); padding: 1.5rem; border-radius: 16px; display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h4 style="margin: 0; color: var(--text-color);">{{ t.title }}</h4>
                    <p style="margin: 0.2rem 0 0 0; color: var(--text-muted); font-size: 0.9rem;">Year {{ t.year }} |
                        Semester {{ t.semester }}</p>
                </div>
                <div style="display: flex; gap: 1rem; align-items: center;">
                    <button data-url="{{ url_for('static', filename=t.file_path.replace('static/', '')) }}"
                        data-title="{{ t.title }}" class="btn btn-outline btn-view"
                        style="font-size: 0.85rem; padding: 0.4rem 1rem;">
                        <i class="fas fa-eye"></i> View
                    </button>
                    <a href="{{ url_for('faculty.edit_timetable', id=t.id) }}"
                        style="color: #fbbf24; font-size: 1.2rem;">
                        <i class="fas fa-edit"></i>
                    </a>
                    <a href="{{ url_for('faculty.delete_timetable', id=t.id) }}"
                        onclick="return confirm('Delete this timetable?')" style="color: #ef4444; font-size: 1.2rem;">
                        <i class="fas fa-trash-alt"></i>
                    </a>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
    {% endif %}
</div>
{% endblock %}

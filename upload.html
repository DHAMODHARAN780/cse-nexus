{% extends "base.html" %}

{% block content %}
<div class="glass-container"
    style="max-width: 800px; margin: 2rem auto; padding: 2rem; border-radius: 24px; position: relative; overflow: hidden;">
    <!-- Background Decor -->
    <div
        style="position: absolute; top: -50px; left: -50px; width: 150px; height: 150px; background: var(--primary-color); filter: blur(80px); opacity: 0.1; pointer-events: none;">
    </div>

    <div
        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; position: relative; z-index: 1;">
        <div>
            <h1
                style="margin: 0; background: var(--gradient); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; font-size: 2.2rem;">
                Upload Material</h1>
            <p style="color: var(--text-muted); margin: 0.5rem 0 0 0;">Share knowledge with the CSE community</p>
        </div>
        <a href="{{ url_for('faculty.dashboard') }}" class="btn btn-outline"
            style="border-radius: 12px; padding: 0.6rem 1.2rem;">
            <i class="fas fa-arrow-left"></i> Back
        </a>
    </div>

    <form action="{{ url_for('faculty.upload') }}" method="POST" enctype="multipart/form-data" class="premium-form">
        <div class="form-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
            <div class="form-group" style="grid-column: span 2;">
                <label for="title"
                    style="color: var(--text-muted); font-weight: 500; font-size: 0.9rem; margin-bottom: 0.5rem; display: block;">Material
                    Title</label>
                <input type="text" name="title" id="title" class="form-control" required
                    placeholder="e.g. Unit 1: Introduction to Data Structures"
                    style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 1rem;">
            </div>

            <div class="form-group">
                <label for="type"
                    style="color: var(--text-muted); font-weight: 500; font-size: 0.9rem; margin-bottom: 0.5rem; display: block;">Content
                    Type</label>
                <select name="type" id="type" class="form-control"
                    style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 1rem;">
                    <option value="material">📄 PDF / Document</option>
                    <option value="video">🎥 Video Lecture</option>
                </select>
            </div>

            <div class="form-group">
                <label for="unit"
                    style="color: var(--text-muted); font-weight: 500; font-size: 0.9rem; margin-bottom: 0.5rem; display: block;">Unit
                    Number</label>
                <select name="unit" id="unit" class="form-control"
                    style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 1rem;">
                    <option value="1">Unit I</option>
                    <option value="2">Unit II</option>
                    <option value="3">Unit III</option>
                    <option value="4">Unit IV</option>
                    <option value="5">Unit V</option>
                </select>
            </div>

            <div class="form-group">
                <label for="semester"
                    style="color: var(--text-muted); font-weight: 500; font-size: 0.9rem; margin-bottom: 0.5rem; display: block;">Semester</label>
                <input type="number" name="semester" id="semester" class="form-control" min="1" max="8" required
                    placeholder="Enter 1-8"
                    style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 1rem;">
            </div>

            <div class="form-group">
                <label for="subject"
                    style="color: var(--text-muted); font-weight: 500; font-size: 0.9rem; margin-bottom: 0.5rem; display: block;">Subject</label>
                <select name="subject" id="subject" class="form-control" required
                    style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 1rem;">
                    <option value="">← Enter Semester First</option>
                </select>
            </div>

            <div class="form-group" style="grid-column: span 2;">
                <label for="file"
                    style="color: var(--text-muted); font-weight: 500; font-size: 0.9rem; margin-bottom: 0.5rem; display: block;">Select
                    File</label>
                <div style="border: 2px dashed rgba(255,255,255,0.1); border-radius: 16px; padding: 2rem; text-align: center; background: rgba(255,255,255,0.01); transition: all 0.3s;"
                    id="drop-zone">
                    <i class="fas fa-cloud-upload-alt"
                        style="font-size: 3rem; color: var(--primary-color); margin-bottom: 1rem; opacity: 0.5;"></i>
                    <p style="margin-bottom: 1rem; color: var(--text-muted);">Drop files here or click to browse</p>
                    <input type="file" name="file" id="file" class="form-control-file" required>
                </div>
            </div>
        </div>

        <input type="hidden" name="year" id="calculated_year" value="1">

        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
            <button type="submit" class="btn btn-primary"
                style="flex: 2; padding: 1.2rem; border-radius: 16px; font-weight: 600; font-size: 1.1rem; background: var(--gradient); border: none; letter-spacing: 1px; box-shadow: 0 8px 24px rgba(var(--primary-rgb), 0.3);">
                <i class="fas fa-rocket"></i> PUBLISH CONTENT
            </button>
            <a href="{{ url_for('faculty.dashboard') }}" class="btn btn-outline"
                style="flex: 1; padding: 1.2rem; border-radius: 16px; display: flex; align-items: center; justify-content: center; border-color: rgba(255,255,255,0.1);">
                CANCEL
            </a>
        </div>
    </form>
</div>

<style>
    .form-control-file {
        width: 100%;
        cursor: pointer;
    }

    #drop-zone:hover {
        border-color: var(--primary-color);
        background: rgba(var(--primary-rgb), 0.05);
    }
</style>
{% endblock %}

{% block scripts %}
<script>
    const semesterInput = document.getElementById('semester');
    const subjectSelect = document.getElementById('subject');
    const yearInput = document.getElementById('calculated_year');

    const updateSubjects = async () => {
        const semester = semesterInput.value;
        if (!semester) {
            subjectSelect.innerHTML = '<option value="">← Enter Semester First</option>';
            return;
        }

        // Calculate year based on semester
        yearInput.value = Math.ceil(semester / 2);

        subjectSelect.innerHTML = '<option value="">Loading...</option>';

        try {
            const response = await fetch(`/admin/api/subjects/${semester}`);
            const subjects = await response.json();

            if (subjects.length === 0) {
                subjectSelect.innerHTML = '<option value="">No subjects found</option>';
            } else {
                subjectSelect.innerHTML = '<option value="">Select Subject</option>';
                subjects.forEach(sub => {
                    const option = document.createElement('option');
                    option.value = sub.title;
                    option.textContent = `${sub.code} - ${sub.title}`;
                    subjectSelect.appendChild(option);
                });
            }
        } catch (error) {
            console.error('Error fetching subjects:', error);
            subjectSelect.innerHTML = '<option value="">Error loading subjects</option>';
        }
    };

    semesterInput.addEventListener('change', updateSubjects);
    semesterInput.addEventListener('input', updateSubjects);
</script>
{% endblock %}

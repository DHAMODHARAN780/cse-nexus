{% extends "base.html" %}

{% block body_class %}auth-page{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 4rem auto; border-radius: 24px;">
    <h2
        style="text-align: center; margin-bottom: 0.5rem; background: var(--gradient); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;">
        Reset Password</h2>
    <p style="text-align: center; color: var(--text-muted); margin-bottom: 2rem;">Enter your email to receive a 6-digit
        OTP.</p>

    <form method="POST">
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" name="email" id="email" class="form-control" placeholder="yourname@gmail.com" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Send OTP Code</button>

        <p style="text-align: center; margin-top: 1.5rem;">
            <a href="{{ url_for('auth.login') }}" style="color: var(--text-muted); font-size: 0.9rem;">Back to Login</a>
        </p>
    </form>
</div>
{% endblock %}
